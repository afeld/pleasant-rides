[project]
name = "pleasant-rides"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "folium>=0.20.0",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "polyline>=2.0.4",
    # 1.64.0 added st.cache_data support for async functions
    "streamlit>=1.64.0",
]

# read by both Pylance and the Pyright CLI
[tool.pyright]
# "strict" also flags every value read from untyped JSON (API responses, Valhalla's edges)
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
