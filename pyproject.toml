[project]
name = "pleasant-rides"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "folium>=0.20.0",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "mercantile>=1.2.1",
    "overturemaps>=1.0.2",
    "polyline>=2.0.4",
    "pyproj>=3.7.1",
    "shapely>=2.1.2",
    # 1.64.0 added st.cache_data support for async functions
    "streamlit>=1.64.0",
]

# read by both Pylance and the Pyright CLI
[tool.pyright]
# "strict" also flags every value read from untyped JSON (API responses, Valhalla's edges)
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "watchdog>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the project isn't installed as a package
pythonpath = ["."]
