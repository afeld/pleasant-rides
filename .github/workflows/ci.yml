name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          # the version used locally
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pyright

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          # the version used locally
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      # the tests don't make network requests, so they don't need any API keys
      - run: uv run pytest
