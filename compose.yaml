# A local BRouter server (https://github.com/abrensch/brouter), so routing doesn't depend on the busy public one. It's the same image as the deployed one (see brouter/Dockerfile). See "Local BRouter" in the README.
name: pleasant-rides

services:
  brouter:
    build:
      context: brouter
      args:
        # tiles to download; see brouter/Dockerfile
        TILES: ${BROUTER_TILES:-W75_N40}
    ports:
      - 127.0.0.1:17777:17777
