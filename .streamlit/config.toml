[server]
runOnSave = true
# the Bike lanes map is ~9 MB of JSON, which compresses to ~1 MB
enableWebsocketCompression = true

# Leafy greens on warm paper. Light and dark are both defined so that the app follows the viewer's system setting and keeps Streamlit's appearance toggle. Text colors meet WCAG AA (at least 4.5:1), including white on primaryColor, except for links in captions in light mode, since Streamlit fades captions.
[theme]
font = "Figtree:https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
headingFontWeights = [600, 600, 500, 500, 500, 500]
baseRadius = "0.75rem"
buttonRadius = "full"
showWidgetBorder = true

[theme.light]
primaryColor = "#2F6B4F"
backgroundColor = "#FBFAF5"
secondaryBackgroundColor = "#F1EFE4"
# this dark since captions are this at 60% opacity, which still needs to pass
textColor = "#0F1A14"
linkColor = "#2F6B4F"
borderColor = "#DDD9C8"
dataframeHeaderBackgroundColor = "#F1EFE4"

[theme.dark]
primaryColor = "#3A8362"
backgroundColor = "#141C18"
secondaryBackgroundColor = "#1F2A25"
textColor = "#E8EDE6"
linkColor = "#9ADBB8"
borderColor = "#34423B"
dataframeHeaderBackgroundColor = "#1F2A25"
